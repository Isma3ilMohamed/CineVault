name: cine_vault
description: "CineVault - A clean architecture Flutter movie app with Bloc."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

resolution: workspace

# The app only composes: main, DI order, MaterialApp. Screens, routes and
# state live in packages/.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  bloc: ^8.1.4
  bloc_concurrency: ^0.2.5
  cached_network_image: ^3.4.1
  carousel_slider: ^5.0.0
  dio: ^5.7.0
  equatable: ^2.0.5
  flutter_bloc: ^8.1.6
  freezed_annotation: ^3.1.0
  get_it: ^8.0.0
  go_router: ^17.5.0
  hive: ^2.2.3
  # Hive.initFlutter() before DI; packages/data opens the boxes.
  hive_flutter: ^1.1.0
  intl: ^0.20.2
  meta: ^1.19.0
  pretty_dio_logger: ^1.4.0
  shared_preferences: ^2.3.2
  shimmer: ^3.0.0
  url_launcher: ^6.3.1
  youtube_player_iframe: ^5.2.0

dev_dependencies:
  bloc_test: ^9.1.7
  build_runner: ^2.16.1
  core_testing:
    path: ../packages/core/testing
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/
