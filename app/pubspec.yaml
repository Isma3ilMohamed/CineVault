name: cine_vault
description: "CineVault - A clean architecture Flutter movie app with Bloc."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

resolution: workspace

# The app only composes: main, DI order, MaterialApp. Screens, routes and
# state live in packages/.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Workspace packages
  core_ui:
    path: ../packages/core/ui
  data:
    path: ../packages/data
  domain:
    path: ../packages/domain
  favorites:
    path: ../packages/features/favorites
  home:
    path: ../packages/features/home
  movie_details:
    path: ../packages/features/movie_details
  movie_list:
    path: ../packages/features/movie_list
  movie_ui:
    path: ../packages/shared/movie_ui
  search:
    path: ../packages/features/search
  settings:
    path: ../packages/features/settings

  flutter_bloc: ^8.1.6
  get_it: ^8.0.0
  go_router: ^17.5.0
  # Hive.initFlutter() before DI; packages/data opens the boxes.
  hive_flutter: ^1.1.0
  injectable: ^3.0.0
  intl: ^0.20.2

dev_dependencies:
  build_runner: ^2.16.1
  # Tests swap TMDB for a fake HTTP adapter and storage for a temp dir.
  dio: ^5.7.0
  flutter_test:
    sdk: flutter
  hive: ^2.2.3
  injectable_generator: ^3.1.3
  shared_preferences: ^2.3.2

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/
