name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same version as local development; bump both together.
  FLUTTER_VERSION: 3.47.4

jobs:
  checks:
    name: Format, analyze, test
    # macOS because the golden files were generated on macOS.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Format
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test (unit, bloc, golden, end-to-end)
        run: flutter test

      - name: Generated code is up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n
          dart format .
          git diff --exit-code || (echo "::error::Generated code is stale. Run build_runner and flutter gen-l10n, then commit." && exit 1)

  build-android:
    name: Build Android (staging)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # The build only needs the defines to exist; the placeholder token is
      # never used because the app is not run.
      - name: Config from the example
        run: cp config/staging.env.example config/staging.env

      - name: Build
        run: flutter build apk --debug --flavor staging --dart-define-from-file=config/staging.env

  build-ios:
    name: Build iOS (staging, simulator)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Config from the example
        run: cp config/staging.env.example config/staging.env

      - name: Build
        run: flutter build ios --simulator --debug --flavor staging --dart-define-from-file=config/staging.env
