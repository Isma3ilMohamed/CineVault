name: Release

# Push a version tag to publish an Android build:
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub Release

env:
  FLUTTER_VERSION: 3.47.4

jobs:
  android:
    name: Android APK (production)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # The token comes from the repository secret and is written to the
      # git-ignored config file only on the runner. Note: compile-time defines
      # end up in the binary, so anyone with the APK can extract it (TMDB read
      # access tokens are read-only).
      - name: Config from secrets
        env:
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
        run: |
          if [ -z "$TMDB_ACCESS_TOKEN" ]; then
            echo "::error::Add the TMDB_ACCESS_TOKEN repository secret first."
            exit 1
          fi
          {
            echo "APP_FLAVOR=production"
            echo "TMDB_BASE_URL=https://api.themoviedb.org/3"
            echo "TMDB_ACCESS_TOKEN=$TMDB_ACCESS_TOKEN"
          } > app/config/production.env

      # Signed with the debug key until a release keystore is added as secrets
      # (app/android/app/build.gradle.kts), so builds from different runners
      # cannot be installed over each other.
      - name: Build
        working-directory: app
        run: flutter build apk --release --flavor production --dart-define-from-file=config/production.env

      - name: Rename
        run: mv app/build/app/outputs/flutter-apk/app-production-release.apk "CineVault-${GITHUB_REF_NAME}.apk"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: CineVault-${{ github.ref_name }}.apk
          generate_release_notes: true
