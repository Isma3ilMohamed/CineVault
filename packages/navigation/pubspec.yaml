name: navigation
description: Typed routes and the app shell. Maps every feature's exit callbacks to locations.
publish_to: none
version: 0.0.1

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  core_ui:
    path: ../core/ui
  domain:
    path: ../domain
  favorites:
    path: ../features/favorites
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^17.5.0
  home:
    path: ../features/home
  intl: ^0.20.2
  movie_details:
    path: ../features/movie_details
  movie_list:
    path: ../features/movie_list
  movie_ui:
    path: ../shared/movie_ui
  search:
    path: ../features/search
  settings:
    path: ../features/settings

dev_dependencies:
  build_runner: ^2.16.1
  flutter_test:
    sdk: flutter
  go_router_builder: ^4.5.0

flutter:
  generate: true
