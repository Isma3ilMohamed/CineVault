name: cine_vault_lints
description: Analyzer plugin enforcing CineVault's feature file anatomy.
publish_to: none
version: 0.0.1

environment:
  sdk: ^3.13.0

# Not a workspace member on purpose: the analysis server resolves plugins in
# their own synthetic package, and the analyzer version here moves with the SDK.

dependencies:
  analysis_server_plugin: ^0.3.23
  analyzer: ^14.4.0

dev_dependencies:
  analyzer_testing: ^0.4.2
  test: ^1.32.0
  test_reflective_loader: ^0.6.0
  very_good_analysis: ^11.0.0
