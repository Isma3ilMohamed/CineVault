include: package:very_good_analysis/analysis_options.yaml

formatter:
  page_width: 100

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - lib/l10n/generated/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # App, not a published package.
    public_member_api_docs: false
    # Matches formatter.page_width above.
    lines_longer_than_80_chars: false
    # Keep classic `ClassName(...)` constructors instead of Dart 3.13's
    # `new(...)` form: more familiar, easier to read for most Flutter devs.
    unnecessary_type_name_in_constructor: false
    # Same reasoning: keep `class X {}` instead of Dart 3.13's `class X;`.
    empty_container_bodies: false
    # pubspec dependencies are grouped by purpose (state, networking, UI...).
    sort_pub_dependencies: false
