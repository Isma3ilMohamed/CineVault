name: cine_vault
description: "CineVault - A clean architecture Flutter movie app with Bloc."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

# Pub workspace: one resolution for the app and every package below.
# Add new packages here; melos picks them up automatically.
workspace:
  - packages/core/base
  - packages/core/result
  - packages/core/ui
  - packages/data
  - packages/domain
  - packages/features/favorites
  - packages/features/home
  - packages/features/movie_details
  - packages/features/movie_list
  - packages/features/search
  - packages/features/settings
  - packages/shared/movie_ui

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Workspace packages
  core_ui:
    path: packages/core/ui
  data:
    path: packages/data
  domain:
    path: packages/domain
  favorites:
    path: packages/features/favorites
  home:
    path: packages/features/home
  movie_details:
    path: packages/features/movie_details
  movie_list:
    path: packages/features/movie_list
  movie_ui:
    path: packages/shared/movie_ui
  search:
    path: packages/features/search
  settings:
    path: packages/features/settings

  # State Management
  flutter_bloc: ^8.1.6

  # Dependency Injection
  get_it: ^8.0.0

  # Local storage instances, opened at startup and handed to packages/data
  shared_preferences: ^2.3.2
  hive_flutter: ^1.1.0

  # Navigation
  go_router: ^14.6.1

  # Utils
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

  # Code Generation
  build_runner: ^2.4.13
  json_serializable: ^6.8.0

  # Workspace tooling
  melos: ^8.6.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/

melos:
  # The app lives at the workspace root (moves to app/ later); include it.
  useRootAsPackage: true
  scripts:
    format:
      description: Fail if any Dart file is not formatted.
      run: dart format --set-exit-if-changed .
    analyze:
      description: >-
        Analyze the whole workspace with infos treated as failures. Uses
        `dart analyze` because `flutter analyze` does not report analyzer
        plugin diagnostics (packages/lints).
      run: dart pub get --directory packages/lints && dart analyze --fatal-infos
    test:
      description: Run every test in the workspace.
      run: dart run melos run test:dart && dart run melos run test:flutter && dart run melos run test:lints
    test:dart:
      description: Tests of pure Dart packages.
      exec: dart test
      packageFilters:
        dirExists: test
        noDependsOn: flutter
    test:flutter:
      description: Tests of Flutter packages and the app.
      exec:
        command: flutter test
        # flutter holds a global startup lock; parallel runs just wait on it.
        concurrency: 1
      packageFilters:
        dirExists: test
        dependsOn: flutter
    test:lints:
      description: Tests of the analyzer plugin (packages/lints, outside the workspace).
      run: cd packages/lints && dart pub get && dart test
