name: cine_vault_workspace
description: Workspace root of CineVault. The app is in app/, everything else in packages/.
publish_to: none

environment:
  sdk: ^3.13.0

# Pub workspace: one resolution for the app and every package below.
# Add new packages here; melos picks them up automatically.
workspace:
  - app
  - packages/core/base
  - packages/core/result
  - packages/core/testing
  - packages/core/ui
  - packages/data
  - packages/domain

dev_dependencies:
  # Shared lint config for every member (analysis_options.yaml includes it).
  very_good_analysis: ^11.0.0
  melos: ^8.6.0

melos:
  scripts:
    format:
      description: Fail if any Dart file is not formatted.
      run: dart format --set-exit-if-changed .
    analyze:
      description: >-
        Analyze the whole workspace with infos treated as failures. Uses
        `dart analyze` because `flutter analyze` does not report analyzer
        plugin diagnostics (packages/lints).
      run: dart pub get --directory packages/lints && dart analyze --fatal-infos
    generate:
      description: >-
        Regenerate code in every package that uses build_runner (freezed,
        injectable), then format it with the workspace's page width.
      run: dart run melos run generate:build && dart format .
    generate:build:
      description: build_runner in each package that depends on it.
      exec:
        command: dart run build_runner build
        concurrency: 1
      packageFilters:
        dependsOn: build_runner
    test:
      description: Run every test in the workspace.
      run: dart run melos run test:dart && dart run melos run test:flutter && dart run melos run test:lints
    test:dart:
      description: Tests of pure Dart packages.
      exec: dart test
      packageFilters:
        dirExists: test
        noDependsOn: flutter
    test:flutter:
      description: Tests of Flutter packages and the app.
      exec:
        command: flutter test
        # flutter holds a global startup lock; parallel runs just wait on it.
        concurrency: 1
      packageFilters:
        dirExists: test
        dependsOn: flutter
    test:lints:
      description: Tests of the analyzer plugin (packages/lints, outside the workspace).
      run: cd packages/lints && dart pub get && dart test
